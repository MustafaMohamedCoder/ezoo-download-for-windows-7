name: Build & Release for Windows 7

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'رقم الإصدار (Release Tag مثل v1.0.8-win7)'
        required: false
        default: 'v1.0.8-win7'
      release_title:
        description: 'عنوان الإصدار'
        required: false
        default: 'Ezoo Download v1.0.8 - Windows 7 / 8 / 10 / 11 Ready'

permissions:
  contents: write

jobs:
  build-win7:
    name: Build Ezoo Download (Windows 7 Compatible)
    runs-on: windows-2022

    steps:
      - name: 📥 استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ إعداد بيئة مجمع MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 🦀 تثبيت بيئة Rust مع الدعم الثابت
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚙️ إعداد بيئة ومكتبات البناء لـ Windows 7
        shell: bash
        run: |
          mkdir -p .cargo
          cat << 'CONF' > .cargo/config.toml
          [target.x86_64-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]

          [target.i686-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]
          CONF

      - name: 📦 بناء التطبيق بصيغة Release المتوافقة مع ويندوز 7
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          SLINT_BACKEND: "winit-software"
        run: |
          cargo build --release --bin EzooDownload

      - name: 🛡️ بناء وتضمين مكتبات التوافقية لويندوز 7 (WaitOnAddress & ProcessPrng Shims)
        shell: cmd
        run: |
          mkdir dist
          mkdir dist\portable
          cl.exe /LD /O2 /nologo tools\win7-shims\api-ms-win-core-synch-l1-2-0.c /Fe:dist\portable\api-ms-win-core-synch-l1-2-0.dll
          cl.exe /LD /O2 /nologo tools\win7-shims\bcryptprimitives.c /Fe:dist\portable\bcryptprimitives.dll
          del /Q dist\portable\*.obj dist\portable\*.exp dist\portable\*.lib 2>nul

      - name: 🛠️ تجهيز الأدوات المساعدة وحزمة التوزيع (Setup & Tools)
        shell: powershell
        run: |
          Copy-Item target\release\EzooDownload.exe dist\portable\ -Force
          Copy-Item dist\portable\api-ms-win-core-synch-l1-2-0.dll dist\ -Force
          Copy-Item dist\portable\bcryptprimitives.dll dist\ -Force
          
          if (Test-Path extension) {
            Copy-Item -Recurse extension dist\portable\ -Force
          }

          @"
          @echo off
          set SLINT_BACKEND=winit-software
          start "" "%~dp0EzooDownload.exe"
          "@ | Out-File -Encoding ASCII dist\portable\Run-Win7.bat

          Compress-Archive -Path dist\portable\* -DestinationPath dist\EzooDownload-Windows7-Portable.zip -Force

      - name: 🚀 رفع النسخة النهائية تلقائياً إلى GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: ${{ github.event.inputs.release_title || 'Ezoo Download (نسخة ويندوز 7 المحدثة مع مكتبات التوافقية)' }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || github.event.inputs.release_tag || 'v1.0.9-win7' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌟 إصدار Ezoo Download المتوافق كلياً مع Windows 7 SP1 / 8 / 10 / 11
            
            تم حل مشكلة التوافق مع Windows 7 نهائياً:
            - 🛡️ **تضمين مكتبة `api-ms-win-core-synch-l1-2-0.dll`**: لحل خطأ `WaitOnAddress` المفقود في Windows 7.
            - 🛡️ **تضمين مكتبة `bcryptprimitives.dll`**: لحل خطأ `ProcessPrng` المفقود في Windows 7.
            - 🎨 **مشغل الرسوميات البرمجي (Software Renderer)**: يعمل بسلاسة دون الحاجة لكروت شاشة حديثة أو DirectX 12.
            - 🚫 **إلغاء التحديث التلقائي**: تم تعطيل التحديث الصامت لضمان بقاء النسخة مستقرة.
          files: |
            dist/EzooDownload-Windows7-Portable.zip
            target/release/EzooDownload.exe
            dist/api-ms-win-core-synch-l1-2-0.dll
            dist/bcryptprimitives.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
