name: Build & Release for Windows 7

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'رقم الإصدار (Release Tag مثل v1.0.9-win7)'
        required: false
        default: 'v1.0.9-win7'
      release_title:
        description: 'عنوان الإصدار'
        required: false
        default: 'Ezoo Download v1.0.9 - Windows 7 / 8 / 10 / 11 Ready'

permissions:
  contents: write

jobs:
  build-win7:
    name: Build Ezoo Download (Windows 7 Compatible)
    runs-on: windows-2022

    steps:
      - name: 📥 استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 تثبيت بيئة Rust مع الدعم الثابت
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚙️ إعداد بيئة ومكتبات البناء لـ Windows 7
        shell: bash
        run: |
          mkdir -p .cargo
          cat << 'CONF' > .cargo/config.toml
          [target.x86_64-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]

          [target.i686-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]
          CONF

      - name: 📦 بناء التطبيق بصيغة Release المتوافقة مع ويندوز 7
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          SLINT_BACKEND: "winit-software"
        run: |
          cargo build --release --bin EzooDownload

      - name: 🛠️ تجهيز ملفات التوزيع وحزمة التثبيت (Setup & Portable)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist, dist\portable | Out-Null
          
          # نسخ ملف exe المستقل مباشرة
          Copy-Item target\release\EzooDownload.exe dist\EzooDownload.exe -Force
          Copy-Item target\release\EzooDownload.exe dist\portable\EzooDownload.exe -Force
          
          if (Test-Path extension) {
            Copy-Item -Recurse extension dist\portable\ -Force
          }

          # إنشاء ملف تشغيل مساعد لويندوز 7
          @"
          @echo off
          set SLINT_BACKEND=winit-software
          start "" "%~dp0EzooDownload.exe"
          "@ | Out-File -Encoding ASCII dist\portable\Run-Win7.bat

          # ضغط النسخة المحمولة
          Compress-Archive -Path dist\portable\* -DestinationPath dist\EzooDownload-Windows7-Portable.zip -Force

      - name: 🚀 رفع النسخة النهائية تلقائياً إلى GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: ${{ github.event.inputs.release_title || 'Ezoo Download (نسخة exe المستقلة المتوافقة كلياً مع ويندوز 7)' }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || github.event.inputs.release_tag || 'v1.0.9-win7' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌟 إصدار Ezoo Download المتوافق مع Windows 7 SP1 / 8 / 10 / 11
            
            - 🛡️ **نسخة EXE مستقلة بالكامل (Standalone)**: تم دمج دوال التوافقية ومحاكاة `WaitOnAddress` و `ProcessPrng` استاتيكياً داخل ملف `EzooDownload.exe` نفسه، ليعمل بمفرده على ويندوز 7 دون الحاجة لأي ملفات DLL خارجية!
            - 🎨 **مشغل الرسوميات البرمجي (Software Renderer Fallback)**: مدمج في الكود ليعمل على كافة كروت الشاشة القديمة.
            - 🚫 **إلغاء التحديثات التلقائية**: تم تعطيل التحديث الصامت نهائياً لمنع استبدال التطبيق.
          files: |
            dist/EzooDownload.exe
            dist/EzooDownload-Windows7-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
