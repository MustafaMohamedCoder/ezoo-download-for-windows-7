name: Build & Release for Windows 7

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'رقم الإصدار (Release Tag مثل v1.0.8-win7)'
        required: false
        default: 'v1.0.8-win7'
      release_title:
        description: 'عنوان الإصدار'
        required: false
        default: 'Ezoo Download v1.0.8 - Windows 7 / 8 / 10 / 11 Ready'

permissions:
  contents: write

jobs:
  build-win7:
    name: Build Ezoo Download (Windows 7 Compatible)
    runs-on: windows-2022

    steps:
      - name: 📥 استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 تثبيت بيئة Rust مع الدعم الثابت
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚙️ إعداد بيئة ومكتبات البناء لـ Windows 7
        shell: bash
        run: |
          mkdir -p .cargo
          cat << 'CONF' > .cargo/config.toml
          [target.x86_64-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]

          [target.i686-pc-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]
          CONF

      - name: 📦 بناء التطبيق بصيغة Release المتوافقة مع ويندوز 7
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          SLINT_BACKEND: "winit-software"
        run: |
          cargo build --release --bin EzooDownload

      - name: 🛠️ تجهيز الأدوات المساعدة وحزمة التوزيع (Setup & Tools)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist, dist\portable | Out-Null
          Copy-Item target\release\EzooDownload.exe dist\portable\ -Force
          
          if (Test-Path extension) {
            Copy-Item -Recurse extension dist\portable\ -Force
          }

          @"
          @echo off
          set SLINT_BACKEND=winit-software
          start "" "%~dp0EzooDownload.exe"
          "@ | Out-File -Encoding ASCII dist\portable\Run-Win7.bat

          Compress-Archive -Path dist\portable\* -DestinationPath dist\EzooDownload-Windows7-Portable.zip -Force

      - name: 🚀 رفع النسخة النهائية تلقائياً إلى GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: ${{ github.event.inputs.release_title || 'Ezoo Download (نسخة ويندوز 7 بدون تحديث تلقائي)' }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || github.event.inputs.release_tag || 'v1.0.8-win7' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌟 إصدار Ezoo Download المخصص لنظام Windows 7 / 8 / 10 / 11
            
            تم بناء هذا الإصدار وتجميعه تلقائياً عبر GitHub Actions:
            - 🛡️ **إلغاء التحديث التلقائي بالكامل**: تم إيقاف التحديث الصامت لمنع استبدال التطبيق بنسخ لا تدعم ويندوز 7.
            - 💻 **توافق كامل مع Windows 7 SP1**: تم ربط الملف التنفيذي برقم نظام فرعي (Subsystem 6.01) ودمج الـ CRT استاتيكياً (+crt-static).
            - 🎨 **مشغل رسوميات مرن (Software Render Fallback)**.
          files: |
            dist/EzooDownload-Windows7-Portable.zip
            target/release/EzooDownload.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
